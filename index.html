<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound Wave Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sound-wave-title">Sound Wave Generator</div>
  
  <div class="controls">
    <button class="btn" id="englishBtn">English</button>
    <button class="btn" id="darkModeBtn">Dark Mode</button>
  </div>
  
  <div class="sound-wave-section">
    <div id="waveContainer" style="display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column;">
      <div class="loader"></div>
      <div class="ready-text">Ready to generate sounds!</div>
    </div>
  </div>
  
  <footer class="footer">
    <p>© 2023 Sound Wave Generator</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const darkModeBtn = document.getElementById('darkModeBtn');
      const darkMode = document.documentElement;
      const loader = document.querySelector('.loader');
      const readyText = document.querySelector('.ready-text');
      
      // Toggle dark mode
      darkModeBtn.addEventListener('click', function() {
        darkMode.setAttribute('data-theme', darkMode.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      });
      
      // Скрываем лоадер и показываем текст после загрузки
      setTimeout(() => {
        loader.style.display = 'none';
        readyText.classList.add('visible');
      }, 1500);
    });
  </script>
</body>
</html>
