<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Wave Generator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="test_performance.js"></script>
</head>
<body>
    <div class="loading-spinner hidden" id="loading-spinner">
        <p>Loading...</p>
        <div class="loading-indicator"></div>
    </div>
    <div class="header">
        <div class="language-selector">
            <select id="language-selector">
                <option value="en">English</option>
                <option value="ru">Русский</option>
            </select>
        </div>
        <div class="theme-selector">
            <label for="theme-selector">Dark Mode:</label>
            <select id="theme-selector">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>
        </div>

        <h1>Sound Wave Generator</h1>
    </div>
    
    
    <div class="controls-panel">
        <div class="settings-container">
            <div class="setting-item">
                <label for="frequency">Frequency (Hz):</label>
                <input type="range" id="frequency" min="20" max="2000" value="440" step="1">
                <span id="frequency-value">440</span>
            </div>
            <div class="setting-item">
                <label for="duration">Duration (s):</label>
                <input type="range" id="duration" min="1" max="10" value="2" step="0.1">
                <span id="duration-value">2</span>
            </div>
            <div class="setting-item">
                <label for="volume">Volume:</label>
                <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
                <span id="volume-value">0.7</span>
            </div>
            <div class="setting-item">
                <label for="animation-speed">Animation Speed:</label>
                <input type="range" id="animation-speed" min="0.1" max="5" value="1" step="0.1" list="speed-steps">
                <datalist id="speed-steps">
                    <option value="0.1">0.1x</option>
                    <option value="0.5">0.5x</option>
                    <option value="1">1x</option>
                    <option value="2">2x</option>
                    <option value="5">5x</option>
                </datalist>
                <span id="animation-speed-value">1x</span>
            </div>
            <div class="setting-item">
                <label for="wave-color">Wave Color:</label>
                <input type="color" id="wave-color" value="#000000">
            </div>
            <div class="setting-item">
            <div class="setting-item">
                <label>
                    <input type="checkbox" id="sound-only">
                    Sound Only
                </label>
                <span id="sound-only-info">Hide wave visualization</span>
            </div>
        </div>
        <div class="action-buttons">
            <button id="play-btn">Play</button>
            <button id="stop-btn">Stop</button>
        </div>
        <div class="audio-effects-panel">
            <h3>Звуковые эффекты</h3>
            <div class="effect-item">
                <label>
                    <input type="checkbox" id="reverb-toggle"> Реверб
                </label>
            </div>
            <div class="effect-item">
                <label for="filter-selector">Тип фильтра:</label>
                <select id="filter-selector">
                    <option value="none">Без фильтра</option>
                    <option value="lowpass">Низкие частоты</option>
                    <option value="highpass">Высокие частоты</option>
                    <option value="bandpass">Полоса пропускания</option>
                </select>
            </div>
            <div class="effect-item">
                <label for="filter-frequency">Частота (Гц):</label>
                <input type="range" id="filter-frequency" min="100" max="5000" value="2000">
            </div>
        </div>
        <div class="export-import">
            <button id="export-btn">Экспортировать</button>
            <button id="import-btn">Импортировать</button>
        </div>
    </div>
    </div>
    
    <div class="wave-container">
        <canvas id="wave-canvas" width="800" height="200"></canvas>
    </div>
    <div class="fixed-controls-panel">
        <button id="play-btn-fixed" class="fixed-btn">Play</button>
        <button id="stop-btn-fixed" class="fixed-btn">Stop</button>
    </div>
    <div class="hotkeys-panel" id="hotkeys-panel" style="display: none;">
    
    <div class="hotkeys-panel" id="hotkeys-panel" style="display: none;">
        <h3>Hotkeys</h3>
        <ul>
            <li>1, 2, 3 — Change wave type</li>
            <li>↑/↓ — Change frequency</li>
            <li>Ctrl+↑/Ctrl+↓ — Change amplitude</li>
            <li>Esc — Reset settings</li>
            <li>Alt+S — Toggle sound only mode</li>
        </ul>
        <button id="close-hotkeys">×</button>
    </div>
    <div class="footer">Sound Wave Generator © 2023</div>
    <input type="file" id="import-file" accept=".json" style="display: none;">
    <script>
    // Загрузка Web Worker для обработки аудио
    const audioWorker = new Worker('workers/audio-worker.js');
</script>
    <script src="sound.js"></script>
    <script src="script.js"></script>
</body>
</html>
